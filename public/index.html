<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="apple-touch-icon" href="/assets/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icon-192.svg">
  <link rel="manifest" href="/manifest.json">
  <title>PhotoDrop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="ambient-background">
    <div class="ambient-blob ambient-blob-1"></div>
    <div class="ambient-blob ambient-blob-2"></div>
  </div>

  <header class="app-header">
    <div class="brand-container">
      <img src="/assets/icon-192.svg" alt="PhotoDrop Logo" class="brand-logo" width="40" height="40">
      <div>
        <h1 class="brand-title" data-i18n="app.title">PhotoDrop</h1>
        <p class="brand-subtitle" data-i18n="app.subtitle">Transfert direct de photos smartphone vers PC</p>
      </div>
    </div>
    <div class="header-actions">
      <select id="langSelect" class="lang-select" aria-label="Langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
    </div>
  </header>

  <main class="main-content">
    <section class="card qr-section">
      <h2 class="card-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span data-i18n="pc.connectionTitle">Connexion Smartphone</span>
      </h2>

      <p class="qr-instruction" data-i18n="pc.scanInstruction">
        Scannez ce QR code avec l'appareil photo de votre smartphone Android pour ouvrir la page de selection.
      </p>

      <div class="qr-frame">
        <img id="qrImage" class="qr-image" src="" alt="QR Code" width="260" height="260">
      </div>

      <div class="network-selector">
        <label for="interfaceSelect" class="form-label" data-i18n="pc.networkInterface">Interface reseau :</label>
        <select id="interfaceSelect" class="form-select"></select>
      </div>

      <div class="direct-link-box">
        <span id="directUrlText" class="direct-link-text">http://...</span>
        <button id="copyUrlBtn" class="btn btn-secondary btn-sm" type="button" data-i18n="pc.copyUrl">Copier l'adresse</button>
      </div>

      <div class="folder-box" style="width: 100%;">
        <label class="form-label" data-i18n="pc.targetFolderTitle">Dossier de destination</label>
        <div id="folderPathDisplay" class="folder-path">...</div>
        <div class="folder-actions">
          <button id="openFolderBtn" class="btn btn-primary" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span data-i18n="pc.openFolder">Ouvrir le dossier</span>
          </button>
        </div>
      </div>
    </section>

    <section class="card history-card">
      <div class="history-header">
        <h2 class="card-title">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span data-i18n="pc.recentTransfers">Transferts recus</span>
        </h2>
        <div class="history-stats">
          <span id="transfersCount">0</span>
          <button id="clearHistoryBtn" class="btn btn-secondary btn-sm" style="margin-left: 12px;" type="button" data-i18n="pc.clearHistory">Effacer l'historique</button>
        </div>
      </div>

      <div id="transfersGrid" class="transfers-grid">
        <div id="emptyState" class="empty-state" style="grid-column: 1 / -1;">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <p data-i18n="pc.noTransfersYet">Aucune photo recue pour l'instant. Scannez le QR code pour commencer.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-sky)" stroke-width="2">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMessage"></span>
  </div>

  <script type="module" src="/js/pc.js"></script>
</body>
</html>
